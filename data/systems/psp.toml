name = "PlayStation Portable"
maker = "Sony"
source = "https://en.wikipedia.org/wiki/PlayStation_Portable"
bio = "Sony's first handheld launched in Japan on 12 December 2004, with a 4.3-inch widescreen and games on UMD, a small optical disc in a plastic shell. Games came as downloads too. Around 1,370 games came out for it, and it sold about 80 million units."
fact = "It is the only handheld console whose games came mainly on an optical disc."

