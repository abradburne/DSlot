# Game Boy Color: the system card's facts, from https://en.wikipedia.org/wiki/Game_Boy_Color
# (read 21 October 2026). The bio and fun fact are DSlot's own words.
name = "Game Boy Color"
maker = "Nintendo"
source = "https://en.wikipedia.org/wiki/Game_Boy_Color"
bio = "The Game Boy in colour: it launched in Japan on 21 October 1998, showing up to 56 colours at once from 32,768, with a double-speed mode for its 8-bit processor, and it still plays the original Game Boy's games. 915 games were made for it."
fact = "It took the place of Project Atlantis, a 32-bit handheld dropped so that a colour Game Boy could come out sooner."

