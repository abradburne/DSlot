# The bio and fun fact are DSlot's own words.
name = "CD-ROM² / TurboGrafx-CD"
maker = "NEC"
source = "https://en.wikipedia.org/wiki/TurboGrafx-16#CD-ROM%C2%B2_/_TurboGrafx-CD"
bio = "The PC Engine's CD-ROM drive arrived in Japan on 4 December 1988, the first time a console played games from CD-ROM. North America got the TurboGrafx-CD in November 1989; a 1991 Super CD-ROM² upgrade raised its buffer RAM from 64 KB to 256 KB."
fact = "Its name is said \"CD-ROM-ROM\", not \"CD-ROM two\" or \"CD-ROM squared\"."

