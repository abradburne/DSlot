# (read 21 October 2026). The bio and fun fact are DSlot's own words.
name = "Game Boy"
maker = "Nintendo"
source = "https://en.wikipedia.org/wiki/Game_Boy"
bio = "Built by Nintendo's R&D1 team around a Sharp 8-bit processor and a 160 × 144 screen in four shades, the Game Boy launched in Japan on 21 April 1989. More than 1,000 games were released for it, and with the Game Boy Color it sold 118.69 million units."
fact = "Some of the engineers called early prototypes \"DameGame\" (dame: hopeless, in Japanese), for their poor screens."

