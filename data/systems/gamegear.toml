# Game Gear: the system card's facts, from https://en.wikipedia.org/wiki/Game_Gear
# (read 21 October 2026). The bio and fun fact are DSlot's own words.
name = "Game Gear"
maker = "Sega"
source = "https://en.wikipedia.org/wiki/Game_Gear"
bio = "Sega's colour handheld launched in Japan on 6 October 1990 with a backlit 160 × 144 screen. It was designed as a Master System to carry, and with an adapter it plays Master System games. More than 300 games were released for it."
fact = "It came with Columns, a falling-block puzzle game, as the Game Boy came with Tetris."

