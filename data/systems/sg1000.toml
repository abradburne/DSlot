name = "SG-1000"
maker = "Sega"
source = "https://en.wikipedia.org/wiki/SG-1000"
bio = "Sega's first home console came out in Japan on 15 July 1983, beside the SC-3000, a version with a keyboard built in. It sold 160,000 units that year, far past the 50,000 Sega expected, and it led on to the Master System."
fact = "It went on sale the very day Nintendo launched the Famicom in Japan."

