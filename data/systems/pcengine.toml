name = "PC Engine / TurboGrafx-16"
maker = "NEC (designed by Hudson Soft)"
source = "https://en.wikipedia.org/wiki/TurboGrafx-16"
bio = "Designed by Hudson Soft and built by NEC, it launched in Japan on 30 October 1987, the first console of the fourth generation. An 8-bit processor drives two 16-bit graphics chips. In Japan it sold 10 million and rivalled the Super Famicom."
fact = "At 14 × 14 × 3.5 cm, the PC Engine is still the smallest major home console ever released."

