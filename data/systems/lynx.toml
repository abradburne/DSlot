name = "Atari Lynx"
maker = "Atari (designed by Epyx)"
source = "https://en.wikipedia.org/wiki/Atari_Lynx"
bio = "Designed by Epyx and launched by Atari in North America on 1 September 1989, the Lynx was the first handheld console with a colour LCD. Its backlit 160 × 102 screen draws from 4,096 colours."
fact = "It was designed by RJ Mical and Dave Needle, who had worked on the Amiga."

