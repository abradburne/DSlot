# WonderSwan: the system card's facts, from https://en.wikipedia.org/wiki/WonderSwan
# (read 21 October 2026). The bio and fun fact are DSlot's own words.
name = "WonderSwan"
maker = "Bandai (with Koto Laboratory)"
source = "https://en.wikipedia.org/wiki/WonderSwan"
bio = "Bandai's Japan-only handheld launched on 4 March 1999, the last hardware Gunpei Yokoi worked on. It runs 40 hours on one AA battery and plays held upright or sideways. With the later Color and SwanCrystal, it sold 3.5 million."
fact = "Yokoi designed the puzzle game Gunpey for it as an answer to Tetris, and it was named in his honour."

