# 32X: the system card's facts, from https://en.wikipedia.org/wiki/32X
# (read 7 November 2026). The bio and fun fact are DSlot's own words.
name = "32X"
maker = "Sega"
source = "https://en.wikipedia.org/wiki/32X"
bio = "Codenamed Project Mars, Sega's cartridge add-on for the Genesis reached North America on 21 November 1994, meant to bridge the gap until the Saturn. Two Hitachi SH-2 processors at 23 MHz sit inside, and it still plays Genesis games. Only 40 games were made for it, six of which also need the Sega CD."
fact = "After a cut to US$99, the last 32X units were cleared out of shops at US$19.95."

