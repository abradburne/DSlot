# Neo Geo Pocket Color: the system card's facts, from https://en.wikipedia.org/wiki/Neo_Geo_Pocket
# (read 21 October 2026). The bio and fun fact are DSlot's own words.
name = "Neo Geo Pocket Color"
maker = "SNK"
source = "https://en.wikipedia.org/wiki/Neo_Geo_Pocket"
bio = "SNK's colour handheld followed its monochrome Neo Geo Pocket, launching in Japan on 19 March 1999 and in North America that August, and it plays the older model's games too. Reviewers liked its microswitched stick. 73 games came out for it."
fact = "SNK sold the monochrome model in North America by mail order, and only two were bought before the colour one arrived."

