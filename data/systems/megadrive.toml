name = "Mega Drive / Genesis"
maker = "Sega"
source = "https://en.wikipedia.org/wiki/Sega_Genesis"
bio = "Sega's 16-bit console launched in Japan as the Mega Drive on 29 October 1988, and in North America as the Genesis. A Motorola 68000 at 7.6 MHz runs its games, with a Z80 for sound. More than 800 games were released for it, and it sold 30.75 million units."
fact = "Sega's advertising promised \"blast processing\", a term with no real meaning in graphics programming."

