bio = "Nintendo's 8-bit console launched in Japan as the Family Computer on 15 July 1983. Its Ricoh 2A03 processor runs at 1.79 MHz, and its picture shows up to 25 colours at once from 54. It sold 61.91 million units."
fact = "The cartridge eject lever was Gunpei Yokoi's idea, and it was there to amuse children."

