name = "Game Boy Advance"
maker = "Nintendo"
source = "https://en.wikipedia.org/wiki/Game_Boy_Advance"
bio = "Nintendo's 32-bit handheld launched in Japan on 21 March 2001, with an ARM7TDMI processor and a screen of 32,768 colours. A second, 8-bit processor lets it play Game Boy and Game Boy Color cartridges too. It sold 81.51 million units."
fact = "Work on one of its last games, Shantae Advance: Risky Revolution, stalled in 2004 for want of a publisher and resumed in 2023."

