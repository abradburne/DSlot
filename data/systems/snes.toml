name = "Super Nintendo"
maker = "Nintendo"
source = "https://en.wikipedia.org/wiki/Super_Nintendo_Entertainment_System"
bio = "Nintendo's 16-bit console launched in Japan as the Super Famicom on 21 November 1990, able to show 256 colours at once from 32,768. 1,757 games were released for it, and it sold 49.10 million units."
fact = "Its first Japanese shipment sold out within hours, and Nintendo delivered later ones at night to keep them from being stolen."

