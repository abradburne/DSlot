name = "Pico"
maker = "Sega"
source = "https://en.wikipedia.org/wiki/Sega_Pico"
bio = "Sega Toys' educational console for children aged 3 to 7 came out in Japan in June 1993 and in North America in November 1994. Shaped like a small laptop, it uses the Mega Drive's processor and graphics chip, and is played with the Magic Pen on a drawing pad and picture-book cartridges called Storyware. Sega says it sold 3.4 million."
fact = "Joe Miller, once a Sega of America vice president, says he named his dog after the Pico."

