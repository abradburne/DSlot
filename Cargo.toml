[package]
name = "dslot"
version = "0.2.0"
edition = "2021"
description = "A cart-and-box launcher for the Anbernic RG DS+, after slot."
license = "GPL-3.0-or-later"

[dependencies]
sdl2 = { version = "=0.36.0", features = ["unsafe_textures"] }
png = "0.17"
fontdue = "0.9"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
